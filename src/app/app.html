<main class="container">
  <header>
    <h1>{{ title() }}</h1>
    <p>Discover, save, and organize your favorite recipes.</p>
    <p class="stats">
      {{ allRecipes().length }} Total 🍳 | {{ favoriteRecipesCount() }} Favorite ❤️
    </p>
    <button class="btn-add-recipe" (click)="showRecipeModal(recipeModal)">+ Add Recipe</button>
  </header>

  <!-- Search Bar -->
  <div class="search-bar">
    <input
      type="text"
      #searchBar
      (input)="setSearchQuery(searchBar.value)"
      placeholder="🔍 Search recipes by title or ingredients..."
    />
  </div>

  <!-- Filter Bar -->
  <nav class="filter-bar">
    <button
      class="filter-btn"
      (click)="setFilter('all')"
      [class.active]="currentFilter() === 'all'"
    >
      All ({{ allRecipes().length }})
    </button>
    <button
      class="filter-btn"
      (click)="setFilter('favorites')"
      [class.active]="currentFilter() === 'favorites'"
    >
      Favorites ❤️({{ favoriteRecipesCount() }})
    </button>
    <button
      class="filter-btn"
      (click)="setFilter('quick')"
      [class.active]="currentFilter() === 'quick'"
    >
      Under 20min ⚡️
    </button>
  </nav>

  <section class="recipe-grid">
    @for (filteredRecipe of filteredRecipes(); track filteredRecipe.id) {
      <app-recipe-card
        [recipe]="filteredRecipe"
        (toggleFavorite)="onToggleFavorite($event)"
        (deleteRecipe)="onDeleteRecipe($event)"
      />
    } @empty {
      <p class="empty-state">No recipes in your recipe box yet!</p>
    }
  </section>
</main>

<!-- New Recipe Modal -->
<dialog #recipeModal class="modal-new-recipe">
  <form
    class="modal-form"
    (submit)="
      onAddRecipe($event, recipeModal, titleInput, descriptionInput, timeInput, difficultySelect)
    "
  >
    <div class="form-group">
      <label>Title</label>
      <input class="modal-title" #titleInput type="text" required placeholder="Recipe Title..." />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea
        class="modal-description"
        #descriptionInput
        required
        placeholder="Write recipe description here!"
      ></textarea>
    </div>

    <div class="form-group">
      <label>Time</label>
      <input class="modal-time" #timeInput type="number" min="1" placeholder="15" />
    </div>

    <div class="form-group">
      <label>Difficulty Level</label>
      <select class="modal-difficulty-select" #difficultySelect>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>
    </div>
    <button class="btn-modal btn-modal-add" type="submit">Add Recipe</button>
    <button class="btn-modal btn-modal-cancel" type="button" (click)="hideRecipeModal(recipeModal)">
      Cancel
    </button>
  </form>
</dialog>
